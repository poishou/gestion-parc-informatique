<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Authentification Norsys Afrique</title>

    <link rel="stylesheet" href="style.css">

    <!-- Logique de connexion -->
    <script type="module" src="./auth.js" defer></script>
</head>

<body>

    <div class="box">
        <img src="Norsyslogo.png" alt="Logo Norsys">
        <h2>Connexion</h2>
        <form id="loginForm">
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="votre.email@norsys.fr"
                required
            >

            <label for="password">Mot de passe</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="*********"
                required
            >

            <p id="errorMessage"></p>

            <button type="submit" class="submit">
                Se connecter
            </button>

        </form>

        <a href="#" id="forgotPassword" class="forgot-password">
            Mot de passe oublié ?
        </a>

    </div>

</body>
</html>
